<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HPCL SOP Management Portal — Standard Operating Procedures for petroleum refinery operations" />
  <title>SOP Portal — HPCL</title>

  <!-- Favicon: document icon inline SVG data URI -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23003DA5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/%3E%3Cpolyline points='14 2 14 8 20 8'/%3E%3Cline x1='16' y1='13' x2='8' y2='13'/%3E%3Cline x1='16' y1='17' x2='8' y2='17'/%3E%3C/svg%3E" />

  <!-- Fonts from Google (Inter + IBM Plex Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Design Tokens -->
  <link rel="stylesheet" href="/static/css/variables.css" />
  <!-- Reset -->
  <link rel="stylesheet" href="/static/css/reset.css" />
  <!-- Layout: shell, navbar, sidebar -->
  <link rel="stylesheet" href="/static/css/layout.css" />
  <!-- Reusable components -->
  <link rel="stylesheet" href="/static/css/components.css" />
  <!-- Page-specific -->
  <link rel="stylesheet" href="/static/css/pages/dashboard.css" />
  <link rel="stylesheet" href="/static/css/pages/wizard.css" />
  <link rel="stylesheet" href="/static/css/pages/sop-detail.css" />
</head>
<body>

  <!-- ══════════════════════════════════════════
       Top Navbar (injected by app.js)
  ══════════════════════════════════════════ -->
  <header id="navbar" class="navbar" role="banner" aria-label="Main navigation"></header>

  <!-- ══════════════════════════════════════════
       Mobile Sidebar Overlay
  ══════════════════════════════════════════ -->
  <div id="sidebar-overlay" class="sidebar-overlay" role="presentation" aria-hidden="true"></div>

  <!-- ══════════════════════════════════════════
       Left Sidebar (nav items injected by sidebar.js)
  ══════════════════════════════════════════ -->
  <aside id="sidebar" class="sidebar" role="navigation" aria-label="Site navigation">
    <!-- Collapse toggle -->
    <button id="sidebar-toggle" class="sidebar-toggle"
      aria-label="Collapse sidebar" title="Collapse sidebar">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>

    <!-- Navigation list -->
    <nav class="sidebar-nav" role="list" aria-label="Main menu">
      <div class="sidebar-section-label" aria-hidden="true">Navigation</div>
      <!-- Items injected by sidebar.js -->
    </nav>

    <!-- Bottom user card -->
    <div class="sidebar-user" aria-label="Current user">
      <!-- Injected by sidebar.js -->
    </div>
  </aside>

  <!-- ══════════════════════════════════════════
       Main Content Area (SPA view renders here)
  ══════════════════════════════════════════ -->
  <main id="main-content" class="main-content" role="main" aria-label="Page content">
    <div id="page-content">
      <!-- Initial loading shimmer while JS boots -->
      <div style="display:flex;flex-direction:column;gap:16px;padding:8px 0;" aria-busy="true" aria-label="Loading">
        <div class="skeleton" style="height:28px;width:180px;border-radius:4px;"></div>
        <div class="skeleton" style="height:16px;width:320px;border-radius:4px;"></div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:8px;">
          <div class="skeleton" style="height:90px;border-radius:6px;"></div>
          <div class="skeleton" style="height:90px;border-radius:6px;"></div>
          <div class="skeleton" style="height:90px;border-radius:6px;"></div>
          <div class="skeleton" style="height:90px;border-radius:6px;"></div>
        </div>
        <div class="skeleton" style="height:320px;border-radius:6px;margin-top:8px;"></div>
      </div>
    </div>
  </main>

  <!-- ══════════════════════════════════════════
       App Entry Point (ES module)
  ══════════════════════════════════════════ -->
  <script type="module" src="/static/js/app.js"></script>

</body>
</html>
